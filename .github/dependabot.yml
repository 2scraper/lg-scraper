# Keeps the SHA-pinned actions current. Every `uses:` in the workflows is
# pinned to a full commit SHA with its release as a comment; Dependabot
# updates both together, so a pin never has to be looked up by hand and never
# silently falls behind a security fix.
#
# Python locks are NOT managed here: they are generated by `uv pip compile`
# (see CONTRIBUTING.md), and audit.yml flags a pin with a known advisory
# every week — which is the signal to refresh them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
