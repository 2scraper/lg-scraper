name: audit

# Known vulnerabilities in every locked dependency set. Weekly as well as on
# every change: a lock that was clean when it was written goes stale the day
# an advisory is published against one of its pins, and nothing else here
# would notice. Offline apart from the advisory database; no credential.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pip-audit from the CI lock
        # pip-audit itself comes from a hashed lock too, rather than from a
        # third-party action or an unpinned `pip install pip-audit`.
        run: pip install --require-hashes -r .github/requirements-ci.lock

      - name: Audit every lock
        # --disable-pip: each lock is complete and hashed, so there is
        # nothing to resolve — pip-audit reads the pins as written.
        run: |
          set -e
          for lock in requirements.lock requirements-playwright.lock \
                      requirements-selenium.lock .github/requirements-ci.lock; do
            echo "== $lock"
            pip-audit --progress-spinner off --require-hashes --disable-pip -r "$lock"
          done

      - name: Audit the pyppeteer lock, minus its known urllib3 1.x advisories
        # pyppeteer requires urllib3<2, and these five are fixed only in 2.x
        # (measured 2026-09-25 against urllib3 1.26.20), so they cannot be
        # cleared while the pyppeteer engine exists. They are ignored BY ID,
        # not by package: any NEW advisory in this lock still fails the job.
        # README says what this means for someone running that engine.
        run: |
          pip-audit --progress-spinner off --require-hashes --disable-pip \
            -r requirements-puppeteer.lock \
            --ignore-vuln PYSEC-2026-141 \
            --ignore-vuln PYSEC-2026-1994 \
            --ignore-vuln PYSEC-2026-1996 \
            --ignore-vuln PYSEC-2026-1998 \
            --ignore-vuln PYSEC-2026-1999
